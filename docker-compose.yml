version: "3.9"

services:
  api:
    build: .
    container_name: api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: "/data/tasks.db"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    volumes:
      - api_data:/data
    depends_on:
      - redis

  worker:
    build: .
    container_name: worker
    command: ["python", "app/worker.py"]
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  api_data:
